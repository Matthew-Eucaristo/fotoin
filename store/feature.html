<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#0b0b0c;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,sans-serif;color:#f5f5f7}
.wrap{display:grid;grid-template-columns:1fr 360px;height:500px}
.copy{padding:64px 0 0 64px}
.mark{display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;letter-spacing:-.02em}
.mark img{width:64px;height:64px;border-radius:15px}
h1{margin:44px 0 0;font-size:64px;line-height:.95;letter-spacing:-.045em;font-weight:800}
p{margin:22px 0 0;font-size:22px;color:#b4b4b9;max-width:30ch;line-height:1.35}
.vf{position:relative;margin:28px 40px 0 0;height:444px;border-radius:26px 26px 0 0;overflow:hidden;background:#000}
.vf img{width:100%;height:100%;object-fit:cover;object-position:30% 15%;filter:saturate(.9)}
.pill{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:10px;background:#1c1c1e;border-radius:999px;padding:6px 16px 6px 6px;font-weight:700;font-size:16px}
.ring{width:34px;height:34px;border-radius:50%;border:4px solid #ffd60a;display:grid;place-items:center;font-size:12px}
.c{position:absolute;width:44px;height:44px;border:6px solid #ffd60a}
.tl{left:40px;top:80px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.tr{right:40px;top:80px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.bl{left:40px;bottom:40px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.br{right:40px;bottom:40px;border-left:0;border-top:0;border-bottom-right-radius:10px}
</style></head><body><div class="wrap"><div class="copy">
<div class="mark"><img src="icon-512.png">Fotoin</div>
<h1>Foto dia persis<br>seperti referensinya.</h1>
<p>Kamera pemandu pose. Gratis, tanpa iklan, semua di HP.</p>
</div><div class="vf"><img src="../docs/img/pose-body.jpg"><span class="pill"><span class="ring">86</span>Pas! Tahan…</span>
<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i></div></div></body></html>
